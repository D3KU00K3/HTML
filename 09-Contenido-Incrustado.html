<!--

 Contenido Incrustado (Iframes)

 Sirve para incrustar contenido externo como videos de youtube,mapas,documentos,interfaces...

 -src-Direccion del contenido
 -Width-Ancho
 -Height-Alto
 -Allowfullscreen-Permite la pantalla completa

-->

<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Contenido Incrustado</title>
    </head>
    <body>
        <h1>iframe</h1>

        <h2>Video de Youtube</h2>
        <iframe width="560" height="315" src="https://www.youtube.com/embed/Kpp0X2EVWyE?si=MX1O7JcrXZ-S7sei" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>

        <h3>Mapa de Google Maps</h3>
        <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d60221.65564970344!2d-99.1897903400622!3d19.37549603719139!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x85d1ff007a7b6303%3A0x20200b7c060cd20d!2sCasa%20de%20jatsune%20miku!5e0!3m2!1ses!2smx!4v1792444755759!5m2!1ses!2smx" width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe>

        <h4>Revista</h4>
        <iframe src="https://heyzine.com/flip-book/383f213883.html#page/32" width="100%" height="600px" frameborder="0" allowfullscreen></iframe>
