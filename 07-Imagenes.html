<!--

 Imagenes 

 Para colocar imagenes dentro de html usamos la etiqueta:
 
 <img />

 Esta etiqueta es de autocierre (self closing). En html 5 la /diagonal ya no es necesaria, pero se considera una buena preactica utilizarla.

 El atributo ´src´ (source u origen) le indica a la etiqueta la ruta de ña imagen a mostrar. Puede recibir una url externa o la ruta (path) interna

 El atributo ´alt´ (alternative text o texto alternativo) es un texto que se mostrara en caso de que la imagen no pueda ser renderizada por el navegador.Este atributo es obligatorio, por que se utiliza como apoyo de accesibilidad

 Los atributos ´width´ y ´height´ nos permiten manipular el tamaño de las imagenes direcrtamente en en html. Se recomienda no utilizar estos atriutos para definir el tamaño de la imagen, sino que se recomienda utilizar CSS para definir el tamaño de la imagen.
-->

<DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Imagenes</title>
    </head>
    <body>
        <h1>Imagenes</h1>
        <p>Las imagenes nos permiten colocar elementos visuales en los sitios web</p>

        <h2>Imagen Externa</h2>
        <img src="https://picsum.photos/200/300?grayscale" alt="Imagen externa" alt="Imagen aleatoria desde lorempicsum.com" />
        
        <h2>Imagen Interna</h2>
        <img src="Images/turbo granny.webp" alt="La fucking goat que carrea la serie" width="500" height="1000"/>
    
    </body>
