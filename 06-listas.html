<!--
 Listas

 Nos ayudan a estructurar informacion de manera ordenada

 Ordenadas:
 Llevan numeracion y la sintaxis es:
 <ol>...</ol>

 No ordenada:
 Llevan bullets o viñetas y la sintaxis es:
 <ul>...</ul>
    
 Para los elementos de la lista se utiliza la sintaxis:
 <li>...</li>
 
 Existe el atributo type que permite cambiar el tipo de numeracion y bullets de una lista

 Para las listas ordenadas los valores son:

 1 Tipo de numero (default)
 a/A Tipo de alfabeto
 i/I Tipo Romano

 Para las listas no ordenadas:

-->

<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Listas</title>
    </head>
    <body>
      <h1>Listas</h1>
      <p>Tenemos listas ordenadas y no ordenadas</p>

        <h2>top 3 portadores de One for all</h2>
        <ol type="1">
            <li>All Might</li>
            <li>Izuku Midoriya</li>
            <li>All for One</li>
        </ol>

        <h2> Top 5 macacos mais facheros do todo mundo</h2>
        <ul type="circle">
            <li>Macaco 1</li>
            <li>Macaco 2</li>
            <li>Macaco 3</li>
            <li>Macaco 4</li>
            <li>Macaco 5</li>
        </ul>
    </body>
</html>
