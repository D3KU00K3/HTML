<!-- 
 Audio y Video

 Estas etiquetas nos permiten insertar contenido multimedia 

 <Audio>...</Audio>
 <Video>...</Video>


 Parametros

 -Controls-Muestra los controles de las etiquetas 
 -Autoplay-Reproduce automaticamente 
 -Loop-Repite ek contenido en bucle
 -Muted- No reproduce el audio

 -Elemento Source
 
 Dentro de las etiquetas <audio> y <video> se define la etiqueta <source /> y a esta etiqueta le pasamos el parametro src como valor la ubicacion del contenido.







-->

<!DOCTYPE html>
<html lang="es">
    <head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Audio y Video</title>
</head>
<body>
   <h1>Audio y Video</h1>

   <h2>Contenido de audio</h2>
   <audio controls autoplay muted>
        <source src="multimedia/New Genesis.mp3"/>
    </audio>

   <h2>Contenido de video</h2>
   <video controls autoplay muted>
        <source src="multimedia/Smash.mp4" />
   </video>


</body>
</html>
